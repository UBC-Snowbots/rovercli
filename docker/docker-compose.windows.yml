services:
  rover:
    build:
      context: ..
      dockerfile: ./Dockerfile
    image: roverflake2:dev
    working_dir: /RoverFlake2
    tty: true
    stdin_open: true
    volumes:
      - roverflake_workspace:/RoverFlake2
    environment:
      ROVERFLAKE_ROOT: /RoverFlake2
      DISPLAY: "${DISPLAY:-host.docker.internal:0.0}"
      QT_X11_NO_MITSHM: "1"

volumes:
  roverflake_workspace:
